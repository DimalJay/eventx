<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Reminder</title>
  <style>
    @media screen and (max-width: 480px) {
      .outer-pad {
        padding: 16px 8px !important;
      }

      .card-pad {
        padding: 16px !important;
      }

      .event-title {
        font-size: 20px !important;
      }

      .hero-text {
        font-size: 26px !important;
      }

      .info-text-val {
        font-size: 11px !important;
      }

      .info-text-lbl {
        font-size: 9px !important;
      }
    }
  </style>
</head>

<body
  style="margin:0;padding:0;background-color:#f1f5f9;background-image:linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);font-family:'Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table align="center" cellpadding="0" cellspacing="0" style="width:100%;max-width:440px;padding:24px 16px;"
    class="outer-pad">
    <tr>
      <td>

        <!-- Header -->
        <table cellpadding="0" cellspacing="0" style="width:100%; text-align:center; margin-bottom: 16px;">
          <tr>
            <td>
              <!-- Logo & Reminder in one line -->
              <table align="center" cellpadding="0" cellspacing="0"
                style="display:inline-block; margin-bottom: 12px; background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(255, 255, 255, 0.5); padding: 6px 12px; border-radius: 999px;">
                <tr>
                  <td style="vertical-align:middle; padding-right:8px;">
                    <img src="https://placehold.co/24x24/3B82F6/fff?text=EX" alt="EventX" width="24" height="24"
                      style="display:block;border-radius:6px;">
                  </td>
                  <td style="vertical-align:middle;">
                    <span
                      style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.18em;color:#2563eb;line-height:1;">REMINDER</span>
                  </td>
                </tr>
              </table>
              <h1 class="hero-text"
                style="margin:0;font-size:32px;font-weight:800;letter-spacing:-0.03em;color:#0f172a;line-height:1.1;">
                STARTS TOMORROW!</h1>
            </td>
          </tr>
        </table>

        <!-- Details card with Glass Effect Simulation -->
        <table cellpadding="0" cellspacing="0"
          style="width:100%;border-radius:20px;border:1px solid rgba(255, 255, 255, 0.6);background: rgba(255, 255, 255, 0.75);box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);">
          <tr>
            <td style="padding:20px 24px;" class="card-pad">
              <table cellpadding="0" cellspacing="0" style="width:100%;">

                <tr>
                  <td style="padding-bottom:12px;text-align:center;border-bottom:1px solid rgba(0, 0, 0, 0.05);">
                    <h2
                      style="margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:#0f172a;"
                      class="event-title">{{eventTitle}}</h2>
                  </td>
                </tr>

                <tr>
                  <td style="padding:12px 0 16px;border-bottom:1px solid rgba(0, 0, 0, 0.05);">
                    <p style="margin:0;font-size:14px;line-height:1.4;color:#334155;text-align:center;">
                      Hi <strong>{{firstName}}</strong>, get ready! Your event starts tomorrow. Make sure to have your
                      ticket ready.
                    </p>
                  </td>
                </tr>

                <!-- 3 separate containers side-by-side in one row -->
                <tr>
                  <td style="padding-top:16px;">
                    <table cellpadding="0" cellspacing="0" style="width:100%; table-layout: fixed;">
                      <tr>
                        <!-- Date Container -->
                        <td style="width:33%; padding-right:4px;">
                          <div
                            style="background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 12px; padding: 10px 4px; box-shadow: 0 2px 6px -1px rgba(0,0,0,0.02); text-align: center; height: 56px;">
                            <span class="info-text-lbl"
                              style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#64748b;display:block;">Date</span>
                            <span class="info-text-val"
                              style="font-weight:700;font-size:13px;color:#0f172a;display:block;margin-top:2px;">{{eventDate}}<br><span
                                style="font-size:11px;color:#64748b;font-weight:normal;">{{eventYear}}</span></span>
                          </div>
                        </td>
                        <!-- Time Container -->
                        <td style="width:33%; padding-left:2px; padding-right:2px;">
                          <div
                            style="background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 12px; padding: 10px 4px; box-shadow: 0 2px 6px -1px rgba(0,0,0,0.02); text-align: center; height: 56px;">
                            <span class="info-text-lbl"
                              style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#64748b;display:block;">Time</span>
                            <span class="info-text-val"
                              style="font-weight:700;font-size:13px;color:#2563eb;display:block;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{eventTime}}</span>
                          </div>
                        </td>
                        <!-- Venue Container -->
                        <td style="width:34%; padding-left:4px;">
                          <div
                            style="background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(255, 255, 255, 0.85); border-radius: 12px; padding: 10px 4px; box-shadow: 0 2px 6px -1px rgba(0,0,0,0.02); text-align: center; height: 56px;">
                            <span class="info-text-lbl"
                              style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#64748b;display:block;">Venue</span>
                            <span class="info-text-val"
                              style="font-weight:700;font-size:13px;color:#0f172a;display:block;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                              title="{{eventLocation}}">{{eventLocation}}</span>
                          </div>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

              </table>
            </td>
          </tr>
        </table>

        <!-- Actions -->
        <table cellpadding="0" cellspacing="0" style="width:100%;margin-top:16px;">
          <tr>
            <td style="padding-bottom:12px;">
              <a href="{{eventLink}}"
                style="display:block;text-align:center;padding:12px 20px;border-radius:12px;background:#2563eb;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#fff;text-decoration:none;box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);">
                View Event Details
              </a>
            </td>
          </tr>
          <tr>
            <td style="text-align:center;">
              <p style="margin:0;font-size:11px;color:#64748b;">You are receiving this because you registered for this
                event.</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>

</html>
