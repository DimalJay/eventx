<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance confirmed — {{eventTitle}}</title>
  <style>
    @media screen and (max-width: 480px) {
      .outer-pad { padding: 28px 12px !important; }
      .card-pad { padding: 22px !important; }
      .hero-text { font-size: 22px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:'Geist','Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table align="center" cellpadding="0" cellspacing="0" style="width:100%;max-width:480px;padding:32px 16px;" class="outer-pad">
    <tr>
      <td>

        <!-- Header / logo -->
        <table cellpadding="0" cellspacing="0" style="width:100%;margin-bottom:24px;">
          <tr>
            <td>
              <table align="center" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#7c3aed;border-radius:12px;width:34px;height:34px;text-align:center;vertical-align:middle;">
                    <span style="color:#ffffff;font-size:17px;line-height:34px;font-family:Arial,Helvetica,sans-serif;">&#10022;</span>
                  </td>
                  <td style="padding-left:10px;vertical-align:middle;">
                    <span style="font-family:'Space Grotesk','Geist','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:0.18em;color:#18181b;">EVENTX</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Card -->
        <table cellpadding="0" cellspacing="0" style="width:100%;border:1px solid #e4e4e7;border-radius:16px;background-color:#ffffff;">
          <tr>
            <td style="padding:32px;" class="card-pad">
              <table cellpadding="0" cellspacing="0" style="width:100%;">
                <tr>
                  <td style="text-align:center;padding-bottom:14px;">
                    <span style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:999px;background-color:#d1fae5;color:#059669;font-size:24px;line-height:1;">&#10003;</span>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding:0 0 10px;">
                    <span style="display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.16em;color:#047857;background-color:#d1fae5;padding:5px 12px;border-radius:999px;">Attendance confirmed</span>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding:0 0 10px;">
                    <h1 class="hero-text" style="margin:0;font-family:'Space Grotesk','Geist','Helvetica Neue',Arial,sans-serif;font-size:25px;font-weight:600;letter-spacing:-0.03em;color:#18181b;line-height:1.18;">You&rsquo;re checked in</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:4px 0 8px;text-align:center;">
                    <p style="margin:0;font-size:14px;line-height:1.7;color:#3f3f46;">
                      Thanks, <strong style="color:#18181b;">{{firstName}} {{lastName}}</strong>! You&rsquo;ve been checked in to <strong style="color:#18181b;">{{eventTitle}}</strong>. Enjoy the event.
                    </p>
                  </td>
                </tr>

                <!-- Details -->
                <tr>
                  <td style="padding:20px 0 0;border-top:1px solid #e4e4e7;">
                    <table cellpadding="0" cellspacing="0" style="width:100%;">
                      <tr>
                        <td style="padding:14px 0 0;">
                          <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;">Checked in</span>
                          <span style="display:block;font-size:14px;font-weight:600;color:#18181b;margin-top:3px;">{{checkinDate}} at {{checkinTime}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:14px 0 0;">
                          <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:#71717a;">Venue</span>
                          <span style="display:block;font-size:14px;font-weight:600;color:#18181b;margin-top:3px;">{{eventLocation}}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table cellpadding="0" cellspacing="0" style="width:100%;margin-top:18px;">
          <tr>
            <td style="text-align:center;border-top:1px solid #e4e4e7;padding-top:16px;">
              <p style="margin:0;font-size:11px;color:#71717a;">You are receiving this because you attended this event on EventX.</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
