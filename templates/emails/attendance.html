<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance confirmed — {{eventTitle}}</title>
  <style>
    @media screen and (max-width: 480px) {
      .outer-pad { padding: 24px 12px !important; }
      .card-pad { padding: 20px !important; }
      .hero-text { font-size: 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:'Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table align="center" cellpadding="0" cellspacing="0" style="width:100%;max-width:480px;padding:32px 16px;" class="outer-pad">
    <tr>
      <td>

        <!-- Header / logo -->
        <table cellpadding="0" cellspacing="0" style="width:100%;margin-bottom:24px;">
          <tr>
            <td>
              <table align="center" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#7c3aed;border-radius:8px;padding:6px 9px;">
                    <span style="color:#ffffff;font-size:13px;font-weight:800;letter-spacing:0.04em;">EX</span>
                  </td>
                  <td style="padding-left:10px;">
                    <span style="font-size:13px;font-weight:800;letter-spacing:0.22em;color:#18181b;">EVENTX</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Card -->
        <table cellpadding="0" cellspacing="0" style="width:100%;border:1px solid #e4e4e7;border-radius:16px;background-color:#ffffff;">
          <tr>
            <td style="padding:28px 32px;" class="card-pad">
              <table cellpadding="0" cellspacing="0" style="width:100%;">
                <tr>
                  <td style="text-align:center;padding-bottom:10px;">
                    <span style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:999px;background-color:#d1fae5;color:#059669;font-size:26px;line-height:1;">&#10003;</span>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding:6px 0 8px;">
                    <span style="display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;color:#059669;">Attendance confirmed</span>
                  </td>
                </tr>
                <tr>
                  <td style="text-align:center;padding:4px 0 8px;">
                    <h1 class="hero-text" style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.03em;color:#18181b;line-height:1.2;">You&rsquo;re checked in</h1>
                  </td>
                </tr>
                <tr>
                  <td style="padding:8px 0 18px;text-align:center;">
                    <p style="margin:0;font-size:14px;line-height:1.6;color:#3f3f46;">
                      Thanks, <strong>{{firstName}} {{lastName}}</strong>! You have been checked in to <strong>{{eventTitle}}</strong>. Enjoy the event.
                    </p>
                  </td>
                </tr>

                <!-- Details -->
                <tr>
                  <td style="padding:14px 0;border-top:1px solid #f0f0f3;">
                    <table cellpadding="0" cellspacing="0" style="width:100%;">
                      <tr>
                        <td style="padding:6px 0;">
                          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#71717a;">Checked in</span>
                          <span style="display:block;font-size:14px;font-weight:600;color:#18181b;margin-top:2px;">{{checkinDate}} at {{checkinTime}}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:6px 0;">
                          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#71717a;">Venue</span>
                          <span style="display:block;font-size:14px;font-weight:600;color:#18181b;margin-top:2px;">{{eventLocation}}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table cellpadding="0" cellspacing="0" style="width:100%;margin-top:16px;">
          <tr>
            <td style="text-align:center;">
              <p style="margin:0;font-size:11px;color:#71717a;">You are receiving this because you attended this event on EventX.</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
